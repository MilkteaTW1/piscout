name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Set version from tag
        run: python tools/set_version.py "${{ github.ref_name }}"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name piscout
          --icon packaging/installer/piscout.ico
          --add-data "piscout/static;piscout/static"
          --add-data "piscout/agent;piscout/agent"
          --collect-submodules uvicorn
          --collect-submodules websockets
          --collect-submodules pyfatfs
          --hidden-import passlib.handlers.sha2_crypt
          run_gui.py

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python packaging/installer/build_installer.py --version "${{ github.ref_name }}"
          if (-not (Test-Path dist\piscout-setup.exe)) { throw "installer was not built" }

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($f in 'piscout.exe', 'piscout-setup.exe') {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Set-Content -Encoding ascii "dist\$f.sha256"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/piscout-setup.exe
            dist/piscout-setup.exe.sha256
            dist/piscout.exe
            dist/piscout.exe.sha256
          body_path: .github/release-notes.md
          prerelease: true
